<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1e4a76">
    <meta name="description" content="HelloBuyer Supermarket ERP">
    <link rel="manifest" href="manifest.json">
    <title>HelloBuyer ERP - Supermarket System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f0f2f5;
        }

        /* Login Page */
        .login-page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e4a76, #0f2b40);
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 16px;
            width: 350px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .login-box h1 {
            color: #1e4a76;
            margin-bottom: 10px;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            background: #1e4a76;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .login-box button:hover {
            background: #0f2b40;
        }

        .error-msg {
            color: red;
            margin-top: 10px;
            font-size: 14px;
        }

        /* Dashboard */
        .hidden {
            display: none;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: #1e4a76;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nav button {
            background: #2c6288;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .nav button.active {
            background: #ffb347;
            color: #1e4a76;
        }

        .logout-btn {
            background: #dc2626 !important;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #1e4a76;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        button {
            background: #1e4a76;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        input {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .product-item, .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin: 5px 0;
            background: #f8f9fa;
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        @media (max-width: 600px) {
            .stats {
                grid-template-columns: 1fr;
            }
            .header {
                flex-direction: column;
                text-align: center;
            }
            .nav {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<!-- LOGIN PAGE -->
<div id="loginPage" class="login-page">
    <div class="login-box">
        <h1>🛒 HelloBuyer</h1>
        <p>Supermarket ERP System</p>
        <input type="text" id="loginEmail" placeholder="Email" value="admin@hellobuyer.com">
        <input type="password" id="loginPassword" placeholder="Password" value="admin123">
        <button onclick="doLogin()">LOGIN</button>
        <div id="loginError" class="error-msg"></div>
        <p style="margin-top: 20px; font-size: 12px; color: #666;">Demo: admin@hellobuyer.com / admin123</p>
    </div>
</div>

<!-- DASHBOARD PAGE -->
<div id="dashboardPage" class="hidden">
    <div class="header">
        <h2>🛒 HelloBuyer ERP</h2>
        <div class="nav">
            <button class="nav-btn active" onclick="showPage('dashboard')">📊 Dashboard</button>
            <button class="nav-btn" onclick="showPage('products')">📦 Products</button>
            <button class="nav-btn" onclick="showPage('pos')">💰 POS</button>
            <button class="nav-btn" onclick="showPage('reports')">📈 Reports</button>
            <button class="logout-btn" onclick="doLogout()">🚪 Logout</button>
        </div>
    </div>
    <div class="container" id="contentArea">
        <!-- Dynamic content -->
    </div>
</div>

<script>
    // ============ HELLOBUYER ERP - WORKING SYSTEM ============
    
    let db = null;
    let currentCart = [];
    let currentUser = null;
    
    const CURRENCY = 'ETB';
    
    function formatMoney(amount) {
        return amount.toFixed(2) + ' ' + CURRENCY;
    }
    
    // ============ DATABASE ============
    function initDatabase() {
        return new Promise((resolve) => {
            const request = indexedDB.open('HelloBuyerDB', 2);
            
            request.onerror = function() {
                console.log('Database error');
                resolve(false);
            };
            
            request.onsuccess = function() {
                db = request.result;
                console.log('Database opened');
                seedData();
                resolve(true);
            };
            
            request.onupgradeneeded = function(event) {
                const db = event.target.result;
                if (!db.objectStoreNames.contains('products')) {
                    db.createObjectStore('products', { keyPath: 'id', autoIncrement: true });
                }
                if (!db.objectStoreNames.contains('sales')) {
                    db.createObjectStore('sales', { keyPath: 'id', autoIncrement: true });
                }
                if (!db.objectStoreNames.contains('sale_items')) {
                    db.createObjectStore('sale_items', { keyPath: 'id', autoIncrement: true });
                }
            };
        });
    }
    
    function seedData() {
        const transaction = db.transaction(['products'], 'readonly');
        const store = transaction.objectStore('products');
        const countRequest = store.count();
        
        countRequest.onsuccess = function() {
            if (countRequest.result === 0) {
                const products = [
                    { name: '🥛 Fresh Milk 1L', price: 120, quantity: 50, barcode: '111111', created_at: new Date().toISOString() },
                    { name: '🍞 Wheat Bread', price: 80, quantity: 30, barcode: '222222', created_at: new Date().toISOString() },
                    { name: '🥚 Eggs 12pcs', price: 150, quantity: 25, barcode: '333333', created_at: new Date().toISOString() },
                    { name: '🍚 White Rice 1kg', price: 180, quantity: 40, barcode: '444444', created_at: new Date().toISOString() },
                    { name: '🫒 Cooking Oil 1L', price: 250, quantity: 20, barcode: '555555', created_at: new Date().toISOString() },
                    { name: '🍬 Sugar 1kg', price: 70, quantity: 60, barcode: '666666', created_at: new Date().toISOString() },
                    { name: '☕ Coffee 200g', price: 300, quantity: 15, barcode: '777777', created_at: new Date().toISOString() }
                ];
                
                const writeTransaction = db.transaction(['products'], 'readwrite');
                const productStore = writeTransaction.objectStore('products');
                products.forEach(p => productStore.add(p));
                console.log('Sample products added');
            }
        };
    }
    
    function getAllProducts() {
        return new Promise((resolve) => {
            const transaction = db.transaction(['products'], 'readonly');
            const store = transaction.objectStore('products');
            const request = store.getAll();
            request.onsuccess = function() {
                resolve(request.result || []);
            };
            request.onerror = function() {
                resolve([]);
            };
        });
    }
    
    function addProduct(product) {
        return new Promise((resolve) => {
            const transaction = db.transaction(['products'], 'readwrite');
            const store = transaction.objectStore('products');
            const request = store.add(product);
            request.onsuccess = function() {
                resolve(request.result);
            };
        });
    }
    
    function updateProduct(product) {
        return new Promise((resolve) => {
            const transaction = db.transaction(['products'], 'readwrite');
            const store = transaction.objectStore('products');
            store.put(product);
            resolve();
        });
    }
    
    function deleteProduct(id) {
        return new Promise((resolve) => {
            const transaction = db.transaction(['products'], 'readwrite');
            const store = transaction.objectStore('products');
            store.delete(id);
            resolve();
        });
    }
    
    function getAllSales() {
        return new Promise((resolve) => {
            const transaction = db.transaction(['sales'], 'readonly');
            const store = transaction.objectStore('sales');
            const request = store.getAll();
            request.onsuccess = function() {
                resolve(request.result || []);
            };
            request.onerror = function() {
                resolve([]);
            };
        });
    }
    
    function addSale(sale) {
        return new Promise((resolve) => {
            const transaction = db.transaction(['sales'], 'readwrite');
            const store = transaction.objectStore('sales');
            const request = store.add(sale);
            request.onsuccess = function() {
                resolve(request.result);
            };
        });
    }
    
    function addSaleItem(item) {
        return new Promise((resolve) => {
            const transaction = db.transaction(['sale_items'], 'readwrite');
            const store = transaction.objectStore('sale_items');
            store.add(item);
            resolve();
        });
    }
    
    // ============ PAGE RENDERING ============
    
    async function showDashboard() {
        const products = await getAllProducts();
        const sales = await getAllSales();
        
        const totalProducts = products.length;
        const lowStock = products.filter(p => p.quantity <= 5).length;
        const totalRevenue = sales.reduce((sum, s) => sum + (s.total || 0), 0);
        
        const today = new Date().toISOString().split('T')[0];
        const todaySales = sales.filter(s => s.date?.split('T')[0] === today).reduce((sum, s) => sum + (s.total || 0), 0);
        
        const html = `
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-number">${totalProducts}</div>
                    <div>Total Products</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${formatMoney(todaySales)}</div>
                    <div>Today's Sales</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${lowStock}</div>
                    <div>Low Stock Items</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${formatMoney(totalRevenue)}</div>
                    <div>Total Revenue</div>
                </div>
            </div>
            <div class="card">
                <h3>⚡ Quick Actions</h3>
                <button onclick="showPage('pos')">💰 Make a Sale</button>
                <button onclick="showPage('products')" style="margin-left:10px;">📦 Manage Products</button>
            </div>
            <div class="card">
                <h3>📊 Recent Sales</h3>
                ${sales.slice(-5).reverse().map(s => `
                    <div style="padding:10px 0; border-bottom:1px solid #ddd;">
                        Sale #${s.id} - ${formatMoney(s.total)} - ${new Date(s.date).toLocaleDateString()}
                    </div>
                `).join('') || '<p>No sales yet</p>'}
            </div>
        `;
        
        document.getElementById('contentArea').innerHTML = html;
    }
    
    async function showProducts() {
        const products = await getAllProducts();
        
        let html = `
            <div class="card">
                <h3>📦 Product Management</h3>
                <div style="display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;">
                    <input type="text" id="searchInput" placeholder="Search products by name..." style="flex:1;">
                    <button onclick="addNewProduct()">+ Add Product</button>
                </div>
                <div style="overflow-x:auto;">
                    <table>
                        <thead>
                            <tr><th>Name</th><th>Price (ETB)</th><th>Stock</th><th>Actions</th></tr>
                        </thead>
                        <tbody id="productsTable"></tbody>
                    </table>
                </div>
            </div>
        `;
        
        document.getElementById('contentArea').innerHTML = html;
        
        function renderProducts(list) {
            const tbody = document.getElementById('productsTable');
            if (list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No products found</td></tr>';
                return;
            }
            tbody.innerHTML = list.map(p => `
                <tr>
                    <td><strong>${p.name}</strong><br><small>${p.barcode || 'no barcode'}</small>${p.quantity <= 5 ? ' <span style="color:orange;">⚠️ Low Stock</span>' : ''}</td>
                    <td>${formatMoney(p.price)}</td>
                    <td>${p.quantity}</td>
                    <td>
                        <button onclick="editProduct(${p.id})" style="background:#3b82f6;">✏️ Edit</button>
                        <button onclick="deleteProductById(${p.id})" style="background:#dc2626;">🗑️ Delete</button>
                    </td>
                </tr>
            `).join('');
        }
        
        renderProducts(products);
        
        document.getElementById('searchInput').oninput = (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(term));
            renderProducts(filtered);
        };
    }
    
    async function showPOS() {
        const products = await getAllProducts();
        currentCart = [];
        
        let html = `
            <div class="card">
                <h3>💰 Point of Sale</h3>
                <input type="text" id="posSearch" placeholder="Search products by name..." style="width:100%; margin-bottom:20px;">
                <div id="productList"></div>
            </div>
            <div class="card">
                <h3>🛒 Shopping Cart</h3>
                <div id="cartList"></div>
                <div style="margin-top:20px; font-size:24px; font-weight:bold;">
                    Total: <span id="cartTotal">${formatMoney(0)}</span>
                </div>
                <button onclick="completeSale()" style="width:100%; margin-top:20px; background:#10b981;">✅ Complete Sale</button>
            </div>
        `;
        
        document.getElementById('contentArea').innerHTML = html;
        
        function updateCartDisplay() {
            let total = 0;
            const cartDiv = document.getElementById('cartList');
            if (currentCart.length === 0) {
                cartDiv.innerHTML = '<p style="text-align:center; color:#666;">Cart is empty</p>';
            } else {
                cartDiv.innerHTML = currentCart.map((item, idx) => {
                    total += item.price * item.qty;
                    return `
                        <div class="cart-item">
                            <div><strong>${item.name}</strong><br>${formatMoney(item.price)} x ${item.qty}</div>
                            <div>${formatMoney(item.price * item.qty)} <button onclick="removeFromCart(${idx})" style="background:#dc2626; padding:5px 10px;">Remove</button></div>
                        </div>
                    `;
                }).join('');
            }
            document.getElementById('cartTotal').innerHTML = formatMoney(total);
        }
        
        function searchProducts() {
            const term = document.getElementById('posSearch').value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(term));
            const productDiv = document.getElementById('productList');
            if (filtered.length === 0) {
                productDiv.innerHTML = '<p style="text-align:center; color:#666;">No products found</p>';
                return;
            }
            productDiv.innerHTML = filtered.map(p => `
                <div class="product-item">
                    <div><strong>${p.name}</strong><br>${formatMoney(p.price)} | Stock: ${p.quantity}</div>
                    <button onclick="addToCart(${p.id}, '${p.name.replace(/'/g, "\\'")}', ${p.price}, ${p.quantity})" style="background:#10b981;">+ Add to Cart</button>
                </div>
            `).join('');
        }
        
        window.updateCartDisplayPOS = updateCartDisplay;
        document.getElementById('posSearch').oninput = searchProducts;
        searchProducts();
        updateCartDisplay();
    }
    
    async function showReports() {
        const products = await getAllProducts();
        const sales = await getAllSales();
        const totalRevenue = sales.reduce((sum, s) => sum + (s.total || 0), 0);
        
        const html = `
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-number">${formatMoney(totalRevenue)}</div>
                    <div>Total Revenue</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${sales.length}</div>
                    <div>Total Sales</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${products.length}</div>
                    <div>Active Products</div>
                </div>
            </div>
            <div class="card">
                <h3>📅 Transaction History</h3>
                ${sales.slice(-10).reverse().map(s => `
                    <div style="padding:10px 0; border-bottom:1px solid #ddd;">
                        <strong>Sale #${s.id}</strong> - ${formatMoney(s.total)} - ${new Date(s.date).toLocaleString()}
                    </div>
                `).join('') || '<p style="text-align:center;">No transactions yet</p>'}
            </div>
        `;
        
        document.getElementById('contentArea').innerHTML = html;
    }
    
    // ============ GLOBAL FUNCTIONS ============
    
    window.addToCart = function(id, name, price, stock) {
        const existing = currentCart.find(i => i.id === id);
        if (existing) {
            if (existing.qty + 1 <= stock) {
                existing.qty++;
            } else {
                alert('Not enough stock!');
                return;
            }
        } else {
            if (stock > 0) {
                currentCart.push({ id, name, price, qty: 1 });
            } else {
                alert('Out of stock!');
                return;
            }
        }
        if (window.updateCartDisplayPOS) window.updateCartDisplayPOS();
    };
    
    window.removeFromCart = function(idx) {
        currentCart.splice(idx, 1);
        if (window.updateCartDisplayPOS) window.updateCartDisplayPOS();
    };
    
    window.completeSale = async function() {
        if (currentCart.length === 0) {
            alert('Cart is empty!');
            return;
        }
        
        const total = currentCart.reduce((sum, i) => sum + (i.price * i.qty), 0);
        const saleId = await addSale({ total, date: new Date().toISOString() });
        
        for (const item of currentCart) {
            await addSaleItem({ sale_id: saleId, product_id: item.id, quantity: item.qty, price: item.price });
            const products = await getAllProducts();
            const product = products.find(p => p.id === item.id);
            if (product) {
                product.quantity -= item.qty;
                await updateProduct(product);
            }
        }
        
        alert(`✅ Sale complete!\nTotal: ${formatMoney(total)}`);
        showPage('pos');
    };
    
    window.editProduct = async function(id) {
        const products = await getAllProducts();
        const product = products.find(p => p.id === id);
        if (!product) return;
        
        const newName = prompt('Product name:', product.name);
        if (newName) product.name = newName;
        const newPrice = parseFloat(prompt('Price (ETB):', product.price));
        if (!isNaN(newPrice)) product.price = newPrice;
        const newQty = parseInt(prompt('Quantity:', product.quantity));
        if (!isNaN(newQty)) product.quantity = newQty;
        
        await updateProduct(product);
        alert('Product updated successfully!');
        showPage('products');
    };
    
    window.deleteProductById = async function(id) {
        if (confirm('Delete this product permanently?')) {
            await deleteProduct(id);
            alert('Product deleted!');
            showPage('products');
        }
    };
    
    window.addNewProduct = async function() {
        const name = prompt('Product name:');
        if (!name) return;
        const price = parseFloat(prompt('Price (ETB):'));
        if (isNaN(price)) return;
        const qty = parseInt(prompt('Quantity:'));
        if (isNaN(qty)) return;
        const barcode = prompt('Barcode (optional):') || '';
        
        await addProduct({ name, price, quantity: qty, barcode, created_at: new Date().toISOString() });
        alert('Product added successfully!');
        showPage('products');
    };
    
    // ============ PAGE NAVIGATION ============
    
    window.showPage = async function(page) {
        // Update active button
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        const buttons = document.querySelectorAll('.nav-btn');
        const pageMap = { 'dashboard': 0, 'products': 1, 'pos': 2, 'reports': 3 };
        const index = pageMap[page];
        if (buttons[index]) buttons[index].classList.add('active');
        
        if (page === 'dashboard') await showDashboard();
        else if (page === 'products') await showProducts();
        else if (page === 'pos') await showPOS();
        else if (page === 'reports') await showReports();
    };
    
    // ============ LOGIN SYSTEM ============
    
    window.doLogin = function() {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        
        if (email === 'admin@hellobuyer.com' && password === 'admin123') {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('dashboardPage').classList.remove('hidden');
            document.getElementById('loginError').innerHTML = '';
            showDashboard();
        } else {
            document.getElementById('loginError').innerHTML = 'Invalid credentials! Use: admin@hellobuyer.com / admin123';
        }
    };
    
    window.doLogout = function() {
        document.getElementById('loginPage').style.display = 'flex';
        document.getElementById('dashboardPage').classList.add('hidden');
        currentCart = [];
    };
    
    // ============ INITIALIZE ============
    
    async function init() {
        await initDatabase();
        console.log('HelloBuyer ERP Ready');
    }
    
    init();
</script>
</body>
</html>
